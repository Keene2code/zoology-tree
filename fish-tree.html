<title>Vertebrate Zoology</title>

<style>
  :root {
    --bg:        #EAEDE8;
    --bg2:       #F4F6F2;
    --fg:        #1A2418;
    --fg-muted:  #7A8A78;
    --accent:    #4A5888;
    --accent-fg: #ffffff;
    --ghost:     #9AAA94;
    --border:    #CDD4CA;
    --rank-col:  #4A5C48;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #141A12;
      --bg2:       #1C241A;
      --fg:        #E2E8DF;
      --fg-muted:  #627060;
      --accent:    #8890C8;
      --accent-fg: #141A12;
      --ghost:     #4A7444;
      --border:    #2C3C2A;
      --rank-col:  #9AAA94;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:        #141A12;
    --bg2:       #1C241A;
    --fg:        #E2E8DF;
    --fg-muted:  #627060;
    --accent:    #8890C8;
    --accent-fg: #141A12;
    --ghost:     #4A7444;
    --border:    #2C3C2A;
    --rank-col:  #9AAA94;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 16px;
    min-height: 100%;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--fg-muted);
    font-size: 0.8rem;
    margin-bottom: 12px;
  }

  /* ── filter + mode bars ── */
  .filter-bar, .mode-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }

  .bar-label {
    font-size: 0.78rem;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 2px;
  }

  .filter-btn, .mode-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
  }

  .filter-btn.active, .mode-btn.active {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }

  /* ── layout ── */
  .app {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .tree-panel {
    flex: 1;
    min-width: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }

  .detail-panel {
    width: 280px;
    flex-shrink: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }

  @media (max-width: 640px) {
    .app { flex-direction: column; }
    .detail-panel { width: 100%; }
  }

  /* ── tree nodes ── */
  .tree-node { list-style: none; }

  .tree-node > ul {
    margin-left: 18px;
    border-left: 1px solid var(--border);
    padding-left: 10px;
    display: none;
  }

  .tree-node.open > ul { display: block; }

  .node-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 4px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }

  .node-row:hover { background: var(--border); }
  .node-row.selected { background: var(--accent); color: var(--accent-fg); }
  .node-row.selected .rank-badge { color: rgba(255,255,255,0.7); }

  .toggle-icon {
    font-size: 0.65rem;
    width: 10px;
    flex-shrink: 0;
    color: var(--fg-muted);
  }

  .node-name { font-weight: 500; font-size: 0.95rem; }
  .node-name.ghost { color: var(--ghost); font-style: italic; }
  .node-common { color: var(--fg-muted); font-size: 0.82rem; }
  .rank-badge {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--rank-col);
    margin-left: auto;
    flex-shrink: 0;
  }

  /* ── detail panel ── */
  .detail-empty {
    color: var(--fg-muted);
    font-size: 0.85rem;
    font-style: italic;
  }

  .breadcrumb { display: flex; flex-direction: column; gap: 4px; }

  .bc-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
  }

  .bc-rank {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--rank-col);
    width: 68px;
    flex-shrink: 0;
  }

  .bc-name { font-weight: 500; }
  .bc-common { color: var(--fg-muted); font-size: 0.78rem; font-style: italic; }

  .adaptations {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .adapt-title {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--rank-col);
    margin-bottom: 6px;
  }

  .adapt-item {
    font-size: 0.8rem;
    color: var(--fg-muted);
    padding-left: 10px;
    position: relative;
    margin-bottom: 4px;
    line-height: 1.4;
  }

  .adapt-item::before {
    content: '·';
    position: absolute;
    left: 2px;
  }

  /* ── quiz panel ── */
  .quiz-panel { display: none; max-width: 560px; }
  .quiz-panel.visible { display: block; }

  .quiz-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .rank-select {
    display: none;
    align-items: center;
    gap: 6px;
  }

  .rank-select.visible { display: flex; }

  .rank-select select {
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    cursor: pointer;
  }

  .quiz-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
  }

  .quiz-prompt {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }

  .quiz-species {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 400;
    margin-bottom: 4px;
  }

  .quiz-secondary {
    color: var(--fg-muted);
    font-size: 0.9rem;
    font-style: italic;
    margin-bottom: 20px;
  }

  .quiz-question {
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 12px;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .quiz-option {
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
    transition: background 0.1s;
  }

  .quiz-option:hover:not(:disabled) { background: var(--border); }
  .quiz-option:disabled { cursor: default; }
  .quiz-option.correct { background: #d4edda; border-color: #3d6438; color: #1a3a1a; }
  .quiz-option.wrong   { background: #f8d7da; border-color: #8b2a30; color: #3a1010; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .quiz-option.correct { background: #1a3a1a; border-color: #6a9864; color: #c8e8c4; }
    :root:not([data-theme="light"]) .quiz-option.wrong   { background: #3a1010; border-color: #9b4a50; color: #f0c0c4; }
  }

  .quiz-feedback {
    margin-top: 14px;
    font-size: 0.88rem;
    color: var(--fg-muted);
    min-height: 1.4em;
  }

  .quiz-next {
    margin-top: 16px;
    padding: 8px 20px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    display: none;
  }

  .quiz-score {
    margin-top: 16px;
    font-size: 0.82rem;
    color: var(--fg-muted);
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">

<h1>Vertebrate Zoology — Study Tree</h1>
<p class="subtitle">Click any node to expand · Select a species for taxonomy + adaptations</p>

<div class="filter-bar">
  <span class="bar-label">Group:</span>
  <button class="filter-btn active" id="filter-all"   onclick="setFilter('all')">All</button>
  <button class="filter-btn"        id="filter-fish"  onclick="setFilter('fish')">Fish</button>
  <button class="filter-btn"        id="filter-birds" onclick="setFilter('birds')">Birds</button>
</div>

<div class="mode-bar">
  <button class="mode-btn active" id="btn-browse" onclick="setMode('browse')">Browse</button>
  <button class="mode-btn"        id="btn-quiz"   onclick="setMode('quiz')">Quiz</button>
</div>

<div class="app" id="browse-view">
  <div class="tree-panel">
    <ul id="tree-root" style="padding:0"></ul>
  </div>
  <div class="detail-panel" id="detail-panel">
    <p class="detail-empty">Select a species to see its taxonomy.</p>
  </div>
</div>

<div class="quiz-panel" id="quiz-view">
  <div class="quiz-controls">
    <span class="bar-label">Mode:</span>
    <button class="mode-btn active" id="qm-random"   onclick="setQuizMode('random')">Random</button>
    <button class="mode-btn"        id="qm-targeted" onclick="setQuizMode('targeted')">Targeted</button>
    <span class="rank-select" id="rank-select">
      <span class="bar-label" style="margin-left:8px">Level:</span>
      <select id="rank-dropdown" onchange="setTargetRank(this.value)">
        <option value="order">Order</option>
        <option value="class">Class</option>
        <option value="family">Family</option>
      </select>
    </span>
  </div>
  <div class="quiz-card">
    <div class="quiz-prompt">Identify the taxon</div>
    <div class="quiz-species"   id="q-species"></div>
    <div class="quiz-secondary" id="q-secondary"></div>
    <div class="quiz-question"  id="q-question"></div>
    <div class="quiz-options"   id="q-options"></div>
    <div class="quiz-feedback"  id="q-feedback"></div>
    <button class="quiz-next" id="q-next" onclick="nextQuestion()">Next question →</button>
    <div class="quiz-score" id="q-score"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// SECTION 1: DATA
// Each node: name, rank, common (optional),
// group ("fish"|"birds" on top-level nodes only),
// adaptations (array, on species only),
// ghost: true for clades with no specimens.
// ─────────────────────────────────────────────

const TREE = {
  name: "Vertebrates", rank: "root",
  children: [

  // ── FISH ─────────────────────────────────
  {
    name: "Myxini", rank: "class", common: "hagfishes", group: "fish",
    children: [{ name: "Myxiniformes", rank: "order", children: [
      { name: "Myxinidae", rank: "family", children: [
        { name: "Eptatretus stoutii", common: "Pacific hagfish", rank: "species" }
      ]}
    ]}]
  },
  {
    name: "Petromyzonti", rank: "class", common: "lampreys", group: "fish",
    children: [{ name: "Petromyzontiformes", rank: "order", children: [
      { name: "Petromyzontidae", rank: "family", children: [
        { name: "Entosphenus tridentatus", common: "Pacific lamprey", rank: "species" }
      ]}
    ]}]
  },
  {
    name: "Chondrichthyes", rank: "class", common: "cartilaginous fishes", group: "fish",
    children: [
      { name: "Elasmobranchii", rank: "subclass", common: "sharks, skates, rays", children: [
        { name: "Squaliformes", rank: "order", common: "sharks", children: [
          { name: "Squalidae", rank: "family", children: [
            { name: "Squalus acanthias", common: "Spiny dogfish", rank: "species" }
          ]}
        ]},
        { name: "Rajiformes", rank: "order", common: "skates, rays", children: [
          { name: "Rajidae", rank: "family", children: [
            { name: "Raja binoculata", common: "Big skate", rank: "species" }
          ]}
        ]}
      ]},
      { name: "Holocephali", rank: "subclass", common: "chimaeras", children: [
        { name: "Chimaeriformes", rank: "order", children: [
          { name: "Chimaeridae", rank: "family", children: [
            { name: "Hydrolagus colliei", common: "Spotted ratfish", rank: "species" }
          ]}
        ]}
      ]}
    ]
  },
  {
    name: "Osteichthyes", rank: "superclass", common: "bony fishes", group: "fish",
    children: [
      { name: "Actinopterygii", rank: "class", common: "ray-finned fishes", children: [
        { name: "Chondrostei", rank: "subclass", children: [
          { name: "Acipenseriformes", rank: "order", common: "sturgeons", children: [
            { name: "Acipenseridae", rank: "family", children: [
              { name: "Acipenser transmontanus", common: "White sturgeon", rank: "species" }
            ]}
          ]}
        ]},
        { name: "Neopterygii", rank: "subclass", common: "new fin fishes", children: [
          { name: "Lepisosteiformes", rank: "order", common: "gars", children: [
            { name: "Lepisosteidae", rank: "family", children: [
              { name: "Lepisosteus spp.", common: "Gars", rank: "species" }
            ]}
          ]},
          { name: "Amiiformes", rank: "order", common: "bowfin", children: [
            { name: "Amiidae", rank: "family", children: [
              { name: "Amia calva", common: "Bowfin", rank: "species" }
            ]}
          ]},
          { name: "Salmoniformes", rank: "order", common: "salmon, trout", children: [
            { name: "Salmonidae", rank: "family", children: [
              { name: "Salmo spp.", common: "Trout", rank: "species" },
              { name: "Oncorhynchus kisutch", common: "Coho salmon", rank: "species" },
              { name: "Oncorhynchus tshawytscha", common: "Chinook salmon", rank: "species" }
            ]}
          ]},
          { name: "Cypriniformes", rank: "order", common: "minnows, suckers", children: [
            { name: "Catostomidae", rank: "family", common: "suckers", children: [
              { name: "Catostomus platyrhynchus", common: "Mountain sucker", rank: "species" }
            ]},
            { name: "Cyprinidae", rank: "family", common: "minnows", children: [
              { name: "Cyprinus carpio", common: "Carp", rank: "species" },
              { name: "Ptychocheilus oregonensis", common: "Northern pikeminnow", rank: "species" }
            ]}
          ]},
          { name: "Siluriformes", rank: "order", common: "catfish", children: [
            { name: "Ictaluridae", rank: "family", children: [
              { name: "Ameiurus melas", common: "Black bullhead", rank: "species" }
            ]}
          ]},
          { name: "Gasterosteiformes", rank: "order", common: "sticklebacks", children: [
            { name: "Gasterosteidae", rank: "family", children: [
              { name: "Gasterosteus aculeatus", common: "Three-spined stickleback", rank: "species" }
            ]}
          ]},
          { name: "Osmeriformes", rank: "order", common: "smelts", children: [
            { name: "Osmeridae", rank: "family", children: [
              { name: "Thaleichthys pacificus", common: "Eulachon", rank: "species" }
            ]}
          ]},
          { name: "Perciformes", rank: "order", common: "perciforms", children: [
            { name: "Centrarchidae", rank: "family", common: "sunfishes", children: [
              { name: "Pomoxis spp.", common: "Crappies", rank: "species" },
              { name: "Lepomis spp.", common: "Bluegill", rank: "species" },
              { name: "Micropterus salmoides", common: "Largemouth bass", rank: "species" }
            ]},
            { name: "Percidae", rank: "family", common: "perches", children: [
              { name: "Perca flavescens", common: "Yellow perch", rank: "species" }
            ]}
          ]},
          { name: "Scorpaeniformes", rank: "order", common: "rockfish, sculpins", children: [
            { name: "Cottidae", rank: "family", children: [
              { name: "Cottus spp.", common: "Sculpins", rank: "species" }
            ]}
          ]},
          { name: "Pleuronectiformes", rank: "order", common: "flatfishes", children: [

              { name: "Platichthys stellatus", common: "Starry flounder", rank: "species" }
            ]}
          ]}
        ]}
      ]},
      { name: "Sarcopterygii", rank: "class", common: "coelacanth and lungfishes",
        ghost: true, note: "No museum specimens — Oregon Zoo has live specimens.", children: [] }
    ]
  },

  // ── BIRDS ────────────────────────────────
  {
    name: "Aves", rank: "class", common: "birds", group: "birds",
    children: [
      // Anseriformes
      { name: "Anseriformes", rank: "order", common: "geese, swans, ducks", children: [
        { name: "Anatidae", rank: "family", common: "waterfowl", children: [
          { name: "Branta canadensis", common: "Canada Goose", rank: "species",
            adaptations: ["Long black neck with white cheek patch", "Smooth slope from bill to forehead (vs. steep in Cackling Goose)"] },
          { name: "Branta hutchinsii", common: "Cackling Goose", rank: "species",
            adaptations: ["Stubbier bill and more rounded head than Canada Goose", "Steep slope from bill to forehead; smaller and more delicate body"] },

          { name: "Mareca americana", common: "American Wigeon", rank: "species",

          { name: "Anas acuta", common: "Northern Pintail", rank: "species",
            adaptations: ["Long, pointed tail in males is the key field mark", "Slender, elegant body compared to other dabbling ducks"] },
          { name: "Bucephala albeola", common: "Bufflehead", rank: "species",
            adaptations: ["North America's smallest diving duck", "Nests almost exclusively in old Northern Flicker cavities"] },
          { name: "Mergus merganser", common: "Common Merganser", rank: "species",
            adaptations: ["Serrated (hooked) bill for gripping slippery fish", "Often nests in large woodpecker-made cavities; overwinters in mixed-species flocks"] },
          { name: "Aix sponsa", common: "Wood Duck", rank: "species",
            adaptations: ["Clawed feet allow perching and gripping tree branches — rare among ducks", "Males ornately iridescent chestnut and green"] },
          { name: "Anas crecca", common: "Green-winged Teal", rank: "species",
            adaptations: ["North America's smallest dabbling duck", "Deep green wing patch visible in flight in both sexes"] }
        ]}
      ]},
      // Galliformes
      { name: "Galliformes", rank: "order", common: "quail, grouse, turkey", children: [
        { name: "Odontophoridae", rank: "family", common: "New World quail", children: [
          { name: "Callipepla californica", common: "California Quail", rank: "species",
            adaptations: ["Distinctive teardrop crest in both sexes", "Highly social in coveys outside breeding season"] }
        ]},
        { name: "Phasianidae", rank: "family", common: "grouse, turkey", children: [
          { name: "Bonasa umbellus", common: "Ruffed Grouse", rank: "species",
            adaptations: ["Displaying males poof out a collar of black ruffled feathers", "Cryptic dappled reddish-gray plumage"] },
          { name: "Centrocercus urophasianus", common: "Greater Sage Grouse", rank: "species",
            adaptations: ["Males inflate bulbous yellow air sacs and fan a starburst tail in mating displays", "Sexually dimorphic; females smaller with diffuse markings; sagebrush obligate"] }
        ]}
      ]},
      // Gaviiformes
      { name: "Gaviiformes", rank: "order", common: "loons", children: [
        { name: "Gaviidae", rank: "family", children: [
          { name: "Gavia immer", common: "Common Loon", rank: "species",
            adaptations: ["Solid (non-hollow) bones reduce buoyancy, enabling rapid dives", "Legs positioned far back on body — agile swimmer but awkward on land", "Red eyes"] }
        ]}
      ]},
      // Podicipediformes
      { name: "Podicipediformes", rank: "order", common: "grebes", children: [
        { name: "Podicipedidae", rank: "family", children: [
          { name: "Podilymbus podiceps", common: "Pied-billed Grebe", rank: "species",
            adaptations: ["Lobed toes (not fully webbed), shared with coots", "Legs far back on body; no visible tail", "Can compress plumage to control buoyancy and sink quietly"] },
          { name: "Aechmophorus occidentalis", common: "Western Grebe", rank: "species",
            adaptations: ["Swallows own feathers while preening — may protect stomach lining from fish bones", "Rarely comes ashore; lobed toes; crisp black-and-white with red eye"] }
        ]}
      ]},
      // Procellariiformes
      { name: "Procellariiformes", rank: "order", common: "tubenoses, albatrosses, shearwaters", children: [
        { name: "Diomedeidae", rank: "family", common: "albatrosses", children: [
          { name: "Phoebastria nigripes", common: "Black-footed Albatross", rank: "species",
            adaptations: ["Tubular nostrils (Tubinares) for salt excretion and prey detection by smell", "Pairs bond for life; very long-lived", "Narrow wings for effortless soaring over open ocean"] }
        ]},
        { name: "Procellariidae", rank: "family", common: "shearwaters", children: [
          { name: "Ardenna grisea", common: "Sooty Shearwater", rank: "species",

        ]}
      ]},
      // Suliformes
      { name: "Suliformes", rank: "order", common: "cormorants, boobies", children: [

// SECTION 2: STATE
// ─────────────────────────────────────────────

let activeFilter = 'all';   // 'all' | 'fish' | 'birds'
let quizMode     = 'random'; // 'random' | 'targeted'
let targetRank   = 'order';  // 'order' | 'class' | 'family'
let score        = { correct: 0, total: 0 };
let currentQuestion = null;

// ─────────────────────────────────────────────
// SECTION 3: FILTER + TREE RENDERING
// ─────────────────────────────────────────────

function setFilter(f) {
  activeFilter = f;
  ['all','fish','birds'].forEach(id =>
    document.getElementById('filter-' + id).classList.toggle('active', id === f)
  );
  renderTree();
  // Reset quiz when filter changes
  score = { correct: 0, total: 0 };
  if (document.getElementById('quiz-view').classList.contains('visible')) {
    renderQuestion();
  }
}

// Walk the tree and return a flat list of { species, path } pairs.
// flatMap is like map, but flattens one level — perfect for tree recursion.
function flattenSpecies(node, path = []) {
  const current = [...path, node];
  if (!node.children || node.children.length === 0) {
    return node.ghost ? [] : [{ species: node, path: current }];
  }
  return node.children.flatMap(child => flattenSpecies(child, current));
}

// Returns species filtered by the active group.
// A species belongs to 'fish' or 'birds' if any ancestor node has that group.
function getFilteredSpecies() {
  return flattenSpecies(TREE).filter(({ path }) => {
    if (activeFilter === 'all') return true;
    return path.some(n => n.group === activeFilter);
  });
}

function renderTree() {
  const root = document.getElementById('tree-root');
  root.innerHTML = '';
  for (const child of TREE.children) {
    if (activeFilter === 'all' || child.group === activeFilter) {
      root.appendChild(buildNode(child, [TREE]));
    }
  }
}

// buildNode takes one node and returns a <li> element representing it.
function buildNode(node, ancestors) {
  const li = document.createElement('li');
  li.className = 'tree-node';

  const isLeaf = !node.children || node.children.length === 0;
  const path = [...ancestors, node];

  const row = document.createElement('div');
  row.className = 'node-row';

  const icon = document.createElement('span');
  icon.className = 'toggle-icon';
  icon.textContent = isLeaf ? '•' : '▶';
  row.appendChild(icon);

  const nameEl = document.createElement('span');
  nameEl.className = 'node-name' + (node.ghost ? ' ghost' : '');
  nameEl.textContent = node.name;
  row.appendChild(nameEl);

  if (node.common) {
    const commonEl = document.createElement('span');
    commonEl.className = 'node-common';
    commonEl.textContent = '— ' + node.common;
    row.appendChild(commonEl);
  }

  if (node.rank !== 'root') {
    const badge = document.createElement('span');
    badge.className = 'rank-badge';
    badge.textContent = node.rank;
    row.appendChild(badge);
  }

  li.appendChild(row);

  if (!isLeaf) {
    const ul = document.createElement('ul');
    for (const child of node.children) {
      ul.appendChild(buildNode(child, path));
    }
    li.appendChild(ul);

    row.addEventListener('click', () => {
      li.classList.toggle('open');
      icon.textContent = li.classList.contains('open') ? '▼' : '▶';
    });
  } else {
    row.addEventListener('click', () => {
      showDetail(path);
      document.querySelectorAll('.node-row.selected')
        .forEach(el => el.classList.remove('selected'));
      row.classList.add('selected');
    });
  }

  return li;
}

// ─────────────────────────────────────────────
// SECTION 4: DETAIL PANEL
// ─────────────────────────────────────────────

function showDetail(path) {
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = '';

  const bc = document.createElement('div');
  bc.className = 'breadcrumb';

  for (const node of path) {
    if (node.rank === 'root') continue;

    const row = document.createElement('div');
    row.className = 'bc-row';

    const rankEl = document.createElement('span');
    rankEl.className = 'bc-rank';
    rankEl.textContent = node.rank;
    row.appendChild(rankEl);

    const nameEl = document.createElement('span');
    nameEl.className = 'bc-name';
    nameEl.textContent = node.name;
    row.appendChild(nameEl);
    bc.appendChild(row);

    if (node.common && node.rank === 'species') {
      const commonRow = document.createElement('div');
      commonRow.className = 'bc-row';
      commonRow.style.paddingLeft = '74px';
      const commonEl = document.createElement('span');
      commonEl.className = 'bc-common';
      commonEl.textContent = node.common;
      commonRow.appendChild(commonEl);
      bc.appendChild(commonRow);
    }
  }

  panel.appendChild(bc);

  // Show adaptations if the species has them
  const species = path[path.length - 1];
  if (species.adaptations && species.adaptations.length > 0) {
    const section = document.createElement('div');
    section.className = 'adaptations';

    const title = document.createElement('div');
    title.className = 'adapt-title';
    title.textContent = 'Notable adaptations';
    section.appendChild(title);

    for (const adapt of species.adaptations) {
      const item = document.createElement('div');
      item.className = 'adapt-item';
      item.textContent = adapt;
      section.appendChild(item);
    }
    panel.appendChild(section);
  }
}

// ─────────────────────────────────────────────
// SECTION 5: QUIZ
// ─────────────────────────────────────────────

// Collect all unique values at a given rank from a pool of species.
function valuesAtRank(pool, rank) {
  const seen = new Set();
  const results = [];
  for (const { path } of pool) {
    for (const node of path) {
      if (node.rank === rank && !seen.has(node.name)) {
        seen.add(node.name);
        results.push(node.name);
      }
    }
  }
  return results;
}

function generateQuestion(attempt = 0) {
  if (attempt > 30) return null; // give up if pool is too thin

  const pool = getFilteredSpecies();
  if (pool.length === 0) return null;

  let species, path, rank, correct;

  if (quizMode === 'targeted') {
    // Only include species that have the target rank in their path
    const eligible = pool.filter(({ path }) => path.some(n => n.rank === targetRank));
    if (eligible.length === 0) return generateQuestion(attempt + 1);

    const pick = eligible[Math.floor(Math.random() * eligible.length)];
    species = pick.species;
    path    = pick.path;
    rank    = targetRank;
    correct = path.find(n => n.rank === rank).name;
  } else {
    // Random mode: pick a random species, then a random rank from its path
    const pick = pool[Math.floor(Math.random() * pool.length)];
    species = pick.species;
    path    = pick.path;

    const askable = ['class', 'subclass', 'order', 'family']
      .filter(r => path.some(n => n.rank === r));
    if (askable.length === 0) return generateQuestion(attempt + 1);

    rank    = askable[Math.floor(Math.random() * askable.length)];
    correct = path.find(n => n.rank === rank).name;
  }

  const allAtRank = valuesAtRank(pool, rank);
  const wrongs = allAtRank
    .filter(n => n !== correct)
    .sort(() => Math.random() - 0.5)
    .slice(0, 3);

  if (wrongs.length === 0) return generateQuestion(attempt + 1);

  const options = [correct, ...wrongs].sort(() => Math.random() - 0.5);
  return { species, rank, correct, options, path };
}

function renderQuestion() {
  currentQuestion = generateQuestion();
  if (!currentQuestion) {
    document.getElementById('q-species').textContent  = 'Not enough data for this filter/mode combination.';
    document.getElementById('q-secondary').textContent = '';
    document.getElementById('q-question').textContent  = '';
    document.getElementById('q-options').innerHTML     = '';
    return;
  }

  const { species, rank, options, path } = currentQuestion;

  // For birds, show common name big and scientific name small (italic).
  // For fish, show scientific name big and common name small.
  const isBird = path.some(n => n.group === 'birds');
  const primaryText   = isBird ? (species.common || species.name) : species.name;
  const secondaryText = isBird ? species.name : (species.common || '');

  document.getElementById('q-species').textContent   = primaryText;
  document.getElementById('q-secondary').textContent = secondaryText;
  document.getElementById('q-question').textContent  = `What is the ${rank}?`;
  document.getElementById('q-feedback').textContent  = '';
  document.getElementById('q-next').style.display    = 'none';
  document.getElementById('q-score').textContent     =
    score.total > 0 ? `${score.correct} / ${score.total} correct` : '';

  const optionsEl = document.getElementById('q-options');
  optionsEl.innerHTML = '';

  for (const opt of options) {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt;
    btn.addEventListener('click', () => handleAnswer(opt));
    optionsEl.appendChild(btn);
  }
}

function handleAnswer(chosen) {
  const { correct } = currentQuestion;
  score.total++;

  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correct) btn.classList.add('correct');
    if (btn.textContent === chosen && chosen !== correct) btn.classList.add('wrong');
  });

  if (chosen === correct) {
    score.correct++;
    document.getElementById('q-feedback').textContent = 'Correct!';
  } else {
    document.getElementById('q-feedback').textContent =
      `Not quite — the ${currentQuestion.rank} is ${correct}.`;
  }

  document.getElementById('q-next').style.display = 'inline-block';
  document.getElementById('q-score').textContent  = `${score.correct} / ${score.total} correct`;
}

function nextQuestion() { renderQuestion(); }

function setQuizMode(mode) {
  quizMode = mode;
  document.getElementById('qm-random').classList.toggle('active',   mode === 'random');
  document.getElementById('qm-targeted').classList.toggle('active', mode === 'targeted');
  document.getElementById('rank-select').classList.toggle('visible', mode === 'targeted');
  score = { correct: 0, total: 0 };
  renderQuestion();
}

function setTargetRank(rank) {
  targetRank = rank;
  score = { correct: 0, total: 0 };
  renderQuestion();
}

// ─────────────────────────────────────────────
// SECTION 6: MODE SWITCHING + BOOT
// ─────────────────────────────────────────────

function setMode(mode) {
  const isBrowse = mode === 'browse';
  document.getElementById('browse-view').style.display = isBrowse ? 'flex' : 'none';
  document.getElementById('quiz-view').classList.toggle('visible', !isBrowse);
  document.getElementById('btn-browse').classList.toggle('active',  isBrowse);
  document.getElementById('btn-quiz').classList.toggle('active',   !isBrowse);
  if (!isBrowse && score.total === 0) renderQuestion();
}

renderTree();
</script>
